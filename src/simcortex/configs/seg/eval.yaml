dataset:
  # Single-dataset mode:
  #   Set dataset.path and outputs.pred_root.
  # Multi-dataset mode:
  #   Keep dataset.path: null and use dataset.roots + outputs.pred_roots.
  path: null
  name: null
  split_file: /path/to/datasets/splits/dataset_split.csv
  split_name: test
  session_label: "01"
  space: MNI152

  roots:
    HCP_YA: /path/to/datasets/hcpya-u100/derivatives/sc-preproc
    OASIS1: /path/to/datasets/oasis-1/derivatives/sc-preproc

evaluation:
  num_classes: 9
  exclude_background: true
  eps: 1.0e-6
  compute_nsd: true
  # Physical surface-distance tolerance. For the 1 mm MNI grid, 1.0 mm equals one voxel.
  nsd_tolerance_mm: 1.0
  nsd_include_background: false
  spacing: [1.0, 1.0, 1.0]

outputs:
  # Single-dataset prediction root:
  pred_root: null

  # Multi-dataset prediction roots produced by seg/inference.py.
  pred_roots:
    HCP_YA: /path/to/datasets/hcpya-u100/derivatives/sc-seg
    OASIS1: /path/to/datasets/oasis-1/derivatives/sc-seg

  # Override this root at runtime. The report paths below are derived from it.
  eval_dir: /path/to/simcortex-runs/seg/exp01_hcpya+oasis1/evals
  log_dir: ${outputs.eval_dir}/logs
  eval_csv: ${outputs.eval_dir}/seg_eval_test.csv
  eval_xlsx: ${outputs.eval_dir}/seg_eval_test.xlsx
  failed_csv: ${outputs.eval_dir}/seg_eval_test_failed.csv
  summary_csv: ${outputs.eval_dir}/seg_eval_test_summary_by_dataset.csv
  summary_json: ${outputs.eval_dir}/seg_eval_test_summary.json

hydra:
  run:
    dir: ${outputs.log_dir}
  output_subdir: null
  job:
    chdir: false
