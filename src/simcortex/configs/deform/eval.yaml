user_config: null

dataset:
  path: null

  split_file: /path/to/datasets/splits/dataset_split.csv
  split_name: test
  session_label: "01"
  space: "MNI152"

  # Multi-dataset mode.
  roots:
    HCP_YA: /path/to/datasets/hcpya-u100/derivatives/sc-preproc
    OASIS1: /path/to/datasets/oasis-1/derivatives/sc-preproc

outputs:
  pred_root: null

  # Multi-dataset mode predictions.
  pred_roots:
    HCP_YA: /path/to/datasets/hcpya-u100/derivatives/sc-deform
    OASIS1: /path/to/datasets/oasis-1/derivatives/sc-deform

  out_dir: /path/to/simcortex-runs/deform/exp01_hcpya+oasis1/eval

eval:
  seed: 1234
  pred_desc: "deform"
  device: "cuda:0"
  n_chamfer: 150000
  n_assd_hd: 150000
  log_level: "INFO"

hydra:
  run:
    dir: ${outputs.out_dir}
  output_subdir: null
  job:
    chdir: false
