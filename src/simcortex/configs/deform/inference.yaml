user_config: null

dataset:
  path: null
  initsurf_root: null

  split_file: /path/to/datasets/splits/dataset_split.csv
  split_name: test
  session_label: "01"
  space: "MNI152"

  # Multi-dataset mode.
  roots:
    HCP_YA: /path/to/datasets/hcpya-u100/derivatives/sc-preproc
    OASIS1: /path/to/datasets/oasis-1/derivatives/sc-preproc

  initsurf_roots:
    HCP_YA: /path/to/datasets/hcpya-u100/derivatives/sc-initsurf
    OASIS1: /path/to/datasets/oasis-1/derivatives/sc-initsurf

  surface_name: ["lh_pial", "lh_white", "rh_pial", "rh_white"]
  prob_clip_min: 0.0
  prob_clip_max: 1.0
  prob_gamma: 1.0
  add_prob_grad: false

inference:
  device: "cuda:0"
  batch_size: 1
  num_workers: 2
  log_level: "INFO"
  overwrite: true

model:
  ckpt_path: /path/to/deform_best_rmse.pth
  strict_load: true
  c_in: 2
  sigma: 1
  n_steps: 8
  inshape: [184, 224, 184]
  c_hid: [8, 16, 32, 64, 128, 128]
  geom_ratio: 0.5
  geom_depth: 6
  gn_groups: 8
  gate_init: -3.0

outputs:
  out_root: null

  # Multi-dataset mode outputs.
  out_roots:
    HCP_YA: /path/to/datasets/hcpya-u100/derivatives/sc-deform
    OASIS1: /path/to/datasets/oasis-1/derivatives/sc-deform

  log_dir: /path/to/simcortex-runs/deform/exp01_hcpya+oasis1/logs_infer
